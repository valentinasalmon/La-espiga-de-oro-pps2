<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pantalla | La Espiga de Oro</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/app.css">
<style>
  /* Pensada para el proyector: tipografía grande que se adapta al ancho. */
  body{font-size:clamp(17px,1.5vw,24px)}
  .stagewrap{max-width:1200px;margin-inline:auto}
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:22px 6px}
  .top h1{font-size:clamp(44px,min(8.5vw,14vh),128px);line-height:.98;margin:0}
  .phase{font-family:var(--f-mono);font-size:clamp(13px,1.3vw,20px);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(24px,6vw,110px);align-items:start;margin-top:clamp(24px,min(6vw,7vh),96px)}
  .side{padding-top:clamp(0px,5vw,90px)}
  .side .phase{font-size:clamp(15px,1.8vw,28px);color:var(--fg);margin-bottom:clamp(12px,1.6vw,24px)}
  .roster{list-style:none;margin:0;padding:0;display:grid;gap:clamp(8px,1vw,14px)}
  .roster li{font-family:var(--f-display);font-weight:600;font-size:clamp(20px,2.8vw,44px);line-height:1.15;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(8px,1vw,16px) clamp(14px,1.8vw,28px);overflow-wrap:anywhere}
  .roster.cols{grid-template-columns:repeat(2,minmax(0,1fr))}
  .roster.cols li{font-size:clamp(16px,2vw,32px)}
  .roster li.new{border-color:var(--accent)}
  .bigbtn{margin-top:clamp(16px,2.4vw,36px);min-height:clamp(54px,6vw,84px);font-size:clamp(18px,2.2vw,34px);padding:0 clamp(20px,2.6vw,40px);font-family:var(--f-display);width:100%}
  .votes{font-family:var(--f-mono);font-size:clamp(16px,1.8vw,28px);color:var(--muted);margin:clamp(12px,1.6vw,22px) 0 0}
  @media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
  .big-title{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,min(4.4vw,6.5vh),60px);line-height:1.05;margin:0 0 10px;text-wrap:balance}
  .qrbox{background:#fff;border-radius:18px;padding:clamp(12px,1.6vw,22px);width:min(100%,clamp(200px,28vw,380px),calc(100vh - 400px));min-width:180px;margin-top:16px}
  .qrbox svg{display:block;width:100%;height:auto}
  .url{font-family:var(--f-mono);font-size:clamp(13px,1.3vw,20px);color:var(--muted);margin-top:12px;overflow-wrap:anywhere}
  .count{font-family:var(--f-display);font-weight:700;font-size:clamp(56px,9vw,140px);line-height:1;color:var(--accent);font-variant-numeric:tabular-nums}
  .teams{display:flex;flex-wrap:wrap;gap:clamp(8px,1vw,14px);margin-top:14px}
  .teams .chip{font-family:var(--f-display);font-weight:600;font-size:clamp(17px,2vw,30px);padding:clamp(6px,.8vw,12px) clamp(14px,1.6vw,24px)}
  .empty{color:var(--muted)}
  /* ganador */
  .winlabel{font-family:var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-size:clamp(14px,1.6vw,24px);margin-top:clamp(18px,3vw,40px)}
  .winname{font-family:var(--f-display);font-weight:700;font-size:clamp(44px,9vw,130px);line-height:1;margin:10px 0 6px;color:var(--accent);text-wrap:balance;overflow-wrap:anywhere}
  .rank{display:grid;gap:12px;margin-top:28px}
  .rrow{display:grid;grid-template-columns:minmax(120px,.7fr) minmax(0,2fr) auto;gap:14px;align-items:center}
  .rrow .nm{font-family:var(--f-display);font-weight:600;font-size:clamp(17px,2vw,30px);overflow-wrap:anywhere}
  .rrow .track{height:clamp(22px,3vw,40px)}
  .rrow .fill{background:var(--accent);border-radius:5px 0 0 5px}
  .rrow.win .fill{background:var(--gold)}
  .rrow .v{font-family:var(--f-mono);font-size:clamp(16px,1.8vw,28px);font-variant-numeric:tabular-nums;min-width:3ch;text-align:right}
  @media (max-width:560px){.rrow{grid-template-columns:minmax(0,1fr) auto}.rrow .track{grid-column:1 / -1;order:3}}
  .total{margin-top:18px;color:var(--muted)}
  /* administración */
  .adminbtn{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:8px 14px;font-size:14px;cursor:pointer;opacity:.6}
  .adminbtn:hover,.adminbtn:focus-visible{opacity:1}
  .panel{position:fixed;inset:auto 0 0 0;max-height:85vh;overflow:auto;background:var(--surface);border-top:2px solid var(--accent);padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.25);z-index:20}
  .panel .in{max-width:640px;margin-inline:auto}
  .panel h3{margin-top:0}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .btn.sm{min-height:46px;font-size:15px;padding:0 14px}
  .btn.warn{background:var(--bad-bg);color:var(--bad)}
  .btn.on{outline:3px solid var(--accent)}
  .tally{list-style:none;margin:8px 0;padding:0;display:grid;gap:6px}
  .tally li{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface2);border-radius:10px;padding:8px 12px}
  .tally .n{overflow-wrap:anywhere}
  .link{appearance:none;border:0;background:none;color:var(--bad);font-weight:600;cursor:pointer;padding:6px 4px}
</style>
</head>
<body>
<div class="full"><div class="awning"></div><div class="scallop"></div></div>
<div class="stagewrap">
  <div class="top"><h1>La Espiga de Oro</h1><span class="phase" id="phase"></span></div>
  <div id="netmsg"></div>
  <div id="stage"></div>
</div>

<button class="adminbtn" id="adminBtn" type="button">Administrar</button>
<div class="panel" id="panel" hidden><div class="in" id="panelIn"></div></div>

<script src="/assets/qrcode.js"></script>
<script>
(function () {
  var $ = function (s) { return document.querySelector(s); };
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  var PHASE_LABEL = { inscripcion: 'Inscripción abierta', votacion: 'Votación abierta', cerrada: 'Votación cerrada' };
  var origin = location.origin;
  var snap = null, lastSig = '';

  /* ---------- QR ---------- */
  function qrBlock(path, caption) {
    var wrap = el('div');
    var url = origin + path;
    var svg = '';
    try {
      var q = qrcode(0, 'M'); q.addData(url); q.make();
      svg = q.createSvgTag({ cellSize: 6, margin: 0, scalable: true });
    } catch (e) { svg = ''; }
    if (svg) { var box = el('div', 'qrbox'); box.innerHTML = svg; box.setAttribute('role', 'img'); box.setAttribute('aria-label', caption); wrap.appendChild(box); }
    wrap.appendChild(el('div', 'url', url.replace(/^https?:\/\//, '')));
    return wrap;
  }

  function chips(teams) {
    var box = el('div', 'teams');
    if (!teams.length) { box.appendChild(el('p', 'empty', 'Todavía no se inscribió ningún equipo.')); return box; }
    teams.forEach(function (t) { box.appendChild(el('span', 'chip', t.name)); });
    return box;
  }

  /* ---------- escenarios ---------- */
  function stageSignup(s) {
    var g = el('div', 'grid');
    var left = el('div');
    left.appendChild(el('h2', 'big-title', 'Inscriban a su equipo'));
    left.appendChild(el('p', 'lead', 'Escaneen el código con el celular y escriban el nombre del equipo.'));
    left.appendChild(qrBlock('/', 'Código QR para inscribirse'));
    var right = el('div', 'side');
    right.appendChild(el('div', 'phase', 'Equipos inscriptos'));
    if (!s.teams.length) {
      right.appendChild(el('p', 'empty', 'Esperando equipos…'));
    } else {
      var ul = el('ul', 'roster' + (s.teams.length > 4 ? ' cols' : ''));
      s.teams.forEach(function (t) { ul.appendChild(el('li', null, t.name)); });
      right.appendChild(ul);
    }
    var go = el('button', 'btn main bigbtn', 'Llegó la hora de votar'); go.type = 'button';
    go.addEventListener('click', function () { goPhase('votacion'); });
    right.appendChild(go);
    g.appendChild(left); g.appendChild(right);
    return g;
  }
  function stageVoting(s) {
    var g = el('div', 'grid');
    var left = el('div');
    left.appendChild(el('h2', 'big-title', 'Llegó la hora de votar'));
    left.appendChild(el('p', 'lead', 'Escaneen el código y voten al mejor equipo. Un solo voto por persona.'));
    left.appendChild(qrBlock('/votar', 'Código QR para votar'));
    var right = el('div', 'side');
    right.appendChild(el('div', 'phase', 'Equipos en competencia'));
    var ul = el('ul', 'roster' + (s.teams.length > 4 ? ' cols' : ''));
    s.teams.forEach(function (t) { ul.appendChild(el('li', null, t.name)); });
    right.appendChild(ul);
    right.appendChild(el('p', 'votes', 'Votos recibidos: ' + s.totalVotes));
    var end = el('button', 'btn bigbtn', 'Cerrar votación y mostrar ganador'); end.type = 'button';
    end.addEventListener('click', function () { goPhase('cerrada'); });
    right.appendChild(end);
    g.appendChild(left); g.appendChild(right);
    return g;
  }
  function stageResults(s) {
    var box = el('div');
    var results = s.results || [];
    var winners = results.filter(function (r) { return (s.winners || []).indexOf(r.id) > -1; });
    if (!winners.length) {
      box.appendChild(el('h2', 'big-title', 'Nadie votó'));
      box.appendChild(el('p', 'lead', 'La votación cerró sin votos.'));
      return box;
    }
    box.appendChild(el('div', 'winlabel', winners.length > 1 ? 'Empate' : 'El mejor equipo'));
    box.appendChild(el('div', 'winname', winners.map(function (w) { return w.name; }).join(' y ')));
    box.appendChild(el('p', 'lead', winners[0].votes + (winners[0].votes === 1 ? ' voto' : ' votos')));
    var max = results[0].votes || 1, rank = el('div', 'rank');
    results.forEach(function (r) {
      var row = el('div', 'rrow' + (winners.indexOf(r) > -1 ? ' win' : ''));
      row.appendChild(el('div', 'nm', r.name));
      var track = el('div', 'track'), fill = el('div', 'fill');
      fill.style.width = (r.votes / max * 100) + '%'; track.appendChild(fill); row.appendChild(track);
      row.appendChild(el('div', 'v', String(r.votes)));
      rank.appendChild(row);
    });
    box.appendChild(rank);
    box.appendChild(el('p', 'total', 'Votos en total: ' + s.totalVotes));
    return box;
  }

  function paint() {
    var s = snap;
    var sig = JSON.stringify([s.phase, s.teams, s.totalVotes, s.phase === 'cerrada' ? s.results : 0]);
    if (sig === lastSig) return;
    lastSig = sig;
    $('#phase').textContent = PHASE_LABEL[s.phase] || '';
    var stage = $('#stage'); stage.innerHTML = '';
    stage.appendChild(s.phase === 'inscripcion' ? stageSignup(s) : s.phase === 'votacion' ? stageVoting(s) : stageResults(s));
  }

  function load() {
    return fetch('/api/estado', { cache: 'no-store' })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'error'); return j; }); })
      .then(function (s) { snap = s; $('#netmsg').innerHTML = ''; paint(); })
      .catch(function (err) {
        var box = $('#netmsg'); box.innerHTML = '';
        box.appendChild(el('p', 'msg err', err && err.message && err.message !== 'Failed to fetch' ? err.message : 'Sin conexión. Reintentando…'));
      });
  }

  /* ---------- administración ---------- */
  var pin = '', adminSnap = null, showTally = false, confirmReset = false, pending = null;
  var panel = $('#panel'), panelIn = $('#panelIn');

  function api(action, extra) {
    return fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ pin: pin, action: action }, extra || {})) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Error'); return j; }); });
  }
  function note(text, kind) {
    var n = panelIn.querySelector('.note'); if (!n) return;
    n.innerHTML = ''; if (text) n.appendChild(el('p', 'msg ' + kind, text));
  }
  function drawLogin() {
    panelIn.innerHTML = '';
    panelIn.appendChild(el('h3', null, pending === 'votacion' ? 'PIN para abrir la votación' : pending === 'cerrada' ? 'PIN para mostrar el ganador' : 'Administrar'));
    var note0 = el('div', 'note'); panelIn.appendChild(note0);
    var f = el('form'); f.noValidate = true;
    var field = el('div', 'field');
    var lab = el('label', null, 'PIN'); lab.htmlFor = 'pinInput';
    var inp = el('input'); inp.id = 'pinInput'; inp.type = 'password'; inp.inputMode = 'numeric'; inp.autocomplete = 'off';
    field.appendChild(lab); field.appendChild(inp); f.appendChild(field);
    var row = el('div', 'row');
    var go = el('button', 'btn main sm', 'Entrar'); go.type = 'submit';
    var close = el('button', 'btn sm', 'Cerrar'); close.type = 'button'; close.addEventListener('click', function () { pending = null; panel.hidden = true; });
    row.appendChild(go); row.appendChild(close); f.appendChild(row); panelIn.appendChild(f);
    f.addEventListener('submit', function (e) {
      e.preventDefault(); pin = inp.value;
      api('check').then(function (s) {
        adminSnap = s;
        if (pending) {
          var v = pending; pending = null;
          return api('phase', { value: v }).then(function (s2) { adminSnap = s2; panel.hidden = true; load(); });
        }
        drawControls();
      })
        .catch(function (err) { pin = ''; note(err.message === 'Failed to fetch' ? 'Sin conexión.' : err.message, 'err'); });
    });
    setTimeout(function () { inp.focus(); }, 0);
  }
  function phaseBtn(label, value, cls) {
    var b = el('button', 'btn sm ' + (cls || '') + (adminSnap.phase === value ? ' on' : ''), label); b.type = 'button';
    b.addEventListener('click', function () {
      api('phase', { value: value }).then(function (s) { adminSnap = s; confirmReset = false; load(); drawControls(); })
        .catch(function (err) { note(err.message, 'err'); });
    });
    return b;
  }
  function drawControls() {
    panelIn.innerHTML = '';
    panelIn.appendChild(el('h3', null, 'Administrar'));
    panelIn.appendChild(el('div', 'note'));
    panelIn.appendChild(el('p', 'hint', 'Fase actual: ' + (PHASE_LABEL[adminSnap.phase] || '') + '. Esta ventana se ve en el proyector.'));
    var r1 = el('div', 'row');
    r1.appendChild(phaseBtn('Abrir inscripción', 'inscripcion'));
    r1.appendChild(phaseBtn('Abrir votación', 'votacion'));
    r1.appendChild(phaseBtn('Cerrar y mostrar ganador', 'cerrada'));
    panelIn.appendChild(r1);

    panelIn.appendChild(el('h3', null, 'Equipos (' + adminSnap.teams.length + ') · votos: ' + adminSnap.totalVotes));
    var tb = el('button', 'btn sm', showTally ? 'Ocultar votos en vivo' : 'Mostrar votos en vivo'); tb.type = 'button';
    tb.addEventListener('click', function () { showTally = !showTally; drawControls(); });
    panelIn.appendChild(tb);
    var ul = el('ul', 'tally');
    var counts = {}; (adminSnap.results || []).forEach(function (r) { counts[r.id] = r.votes; });
    adminSnap.teams.forEach(function (t) {
      var li = el('li'); li.appendChild(el('span', 'n', t.name + (showTally ? ' · ' + (counts[t.id] || 0) + ' votos' : '')));
      var rm = el('button', 'link', 'Quitar'); rm.type = 'button';
      rm.addEventListener('click', function () {
        api('removeTeam', { team: t.id }).then(function (s) { adminSnap = s; load(); drawControls(); }).catch(function (err) { note(err.message, 'err'); });
      });
      li.appendChild(rm); ul.appendChild(li);
    });
    if (!adminSnap.teams.length) ul.appendChild(el('li', null, 'Sin equipos.'));
    panelIn.appendChild(ul);

    var r2 = el('div', 'row');
    if (!confirmReset) {
      var rs = el('button', 'btn sm warn', 'Reiniciar todo'); rs.type = 'button';
      rs.addEventListener('click', function () { confirmReset = true; drawControls(); });
      r2.appendChild(rs);
    } else {
      var yes = el('button', 'btn sm warn', 'Sí, borrar equipos y votos'); yes.type = 'button';
      yes.addEventListener('click', function () {
        api('reset').then(function (s) { adminSnap = s; confirmReset = false; load(); drawControls(); }).catch(function (err) { note(err.message, 'err'); });
      });
      var no = el('button', 'btn sm', 'Cancelar'); no.type = 'button';
      no.addEventListener('click', function () { confirmReset = false; drawControls(); });
      r2.appendChild(yes); r2.appendChild(no);
    }
    var close = el('button', 'btn sm', 'Cerrar panel'); close.type = 'button';
    close.addEventListener('click', function () { panel.hidden = true; });
    r2.appendChild(close);
    panelIn.appendChild(r2);
  }
  function goPhase(value) {
    function login() { pending = value; pin = ''; adminSnap = null; panel.hidden = false; drawLogin(); }
    if (!(pin && adminSnap)) return login();
    api('phase', { value: value }).then(function (s) { adminSnap = s; load(); }).catch(login);
  }
  $('#adminBtn').addEventListener('click', function () {
    pending = null;
    panel.hidden = !panel.hidden;
    if (!panel.hidden) { if (pin && adminSnap) drawControls(); else drawLogin(); }
  });
  setInterval(function () {
    if (!panel.hidden && pin && adminSnap) api('check').then(function (s) { adminSnap = s; drawControls(); }).catch(function () {});
  }, 6000);

  load();
  setInterval(load, 3000);
})();
</script>
</body>
</html>
